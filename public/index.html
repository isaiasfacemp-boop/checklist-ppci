<style>
/* Layout: ferramenta de campo, uma coluna no celular; barra fixa com progresso + navegação por seções; seções empilhadas */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunken:#F6F7F9; --ink:#1A1F26; --muted:#5A6472; --line:#D7DCE3;
  --accent:#C2391D; --accent-soft:#F8E3DD; --on-accent:#FFFFFF;
  --ok:#1D8549; --ok-soft:#DDF1E5; --na:#8C6A12; --na-soft:#F4ECD3;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --logo:#1D2E5C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111519; --surface:#1A2027; --sunken:#151A20; --ink:#E7EBF0; --muted:#97A1AE; --line:#2C343E;
  --accent:#EE5F3F; --accent-soft:#3A221C; --on-accent:#14100E;
  --ok:#41C47C; --ok-soft:#173226; --na:#D9B04A; --na-soft:#352C15; --logo:#C9D3EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111519; --surface:#1A2027; --sunken:#151A20; --ink:#E7EBF0; --muted:#97A1AE; --line:#2C343E;
  --accent:#EE5F3F; --accent-soft:#3A221C; --on-accent:#14100E;
  --ok:#41C47C; --ok-soft:#173226; --na:#D9B04A; --na-soft:#352C15; --logo:#C9D3EC; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 96px;position:relative}
.bt-tema{width:42px;height:42px;padding:0;border-radius:999px;flex:none}
.bt-tema svg{width:20px;height:20px}
.tema-row{display:flex;justify-content:flex-end;padding-top:12px;margin-bottom:-22px;position:relative;z-index:2}
@media (max-width:640px){.tema-row{margin-bottom:-6px}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;z-index:15;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.18);max-height:290px;overflow:auto}
.ac-op{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.ac-op small{color:var(--muted);font-family:var(--mono);font-size:11px;align-self:center;white-space:nowrap}
.ac-op+.ac-op{border-top:1px solid var(--line)}
.ac-op.on,.ac-op:hover{background:var(--sunken)}
label.f>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.top-row{display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{font-size:22px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;min-height:42px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:default}
.savestate{font-size:12px;color:var(--muted);font-family:var(--mono)}
.progress{display:flex;align-items:center;gap:10px;padding:6px 0 8px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.nav button b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--muted)}
.nav button.done{border-color:var(--ok);color:var(--ok)}
.nav button.done b{color:var(--ok)}
.nav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.nav button[aria-current="true"] b{color:var(--surface)}
.stepnav{display:flex;gap:10px;justify-content:space-between;padding-top:20px}
.stepnav .btn{flex:1 1 0;min-width:0}
.stepnav .btn span{overflow:hidden;text-overflow:ellipsis}
.stepnav.topo{padding-top:4px;padding-bottom:12px;gap:8px}
.stepnav.topo .btn{min-height:32px;padding:4px 10px;font-size:13px;flex:0 1 auto}
.stepnav.topo .btn svg{width:15px;height:15px}
.stepnav.topo>span{flex:1}

.home-h .logo{width:clamp(84px,22vw,170px);flex:none}
.top .logo{width:58px;flex:none}
@media (max-width:480px){.top .logo{display:none}}
/* início */
.home-h{padding-block:28px 18px;display:flex;align-items:center;justify-content:safe center;gap:clamp(14px,3vw,28px)}
.home-tx{display:grid;gap:4px;min-width:0;flex:0 1 auto;justify-items:center;text-align:center;padding-left:clamp(14px,3vw,28px);border-left:2px solid var(--line)}
.home-h small{margin-top:4px;font-size:clamp(13px,3.4vw,17px);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.home-h h1{font-size:clamp(24px,6.4vw,46px);font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.home-h p{margin:6px auto 0;color:var(--muted);max-width:42ch;font-size:clamp(13px,3.4vw,15px)}
.home-h~.notice{text-align:center}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:150px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile:active{transform:scale(.985)}
.tile-ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.tile-ic svg{width:30px;height:30px}
.tile-tx{display:grid;gap:3px;justify-items:center}
.tile-tx strong{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.tile-tx em{font-style:normal;font-size:13px;color:var(--muted)}
.tile-n{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.t-novo{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.t-novo:hover{border-color:var(--accent)}
.t-novo .tile-ic{background:rgba(255,255,255,.18)}
.t-novo .tile-tx em{color:inherit;opacity:.85}
.t-and{background:var(--na);border-color:var(--na);color:var(--on-accent)}
.t-ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.t-and:hover{border-color:var(--na)}.t-ok:hover{border-color:var(--ok)}
.t-and .tile-ic,.t-ok .tile-ic{background:rgba(255,255,255,.18)}
.t-and .tile-tx em,.t-ok .tile-tx em{color:inherit;opacity:.85}
.tile:hover{filter:brightness(1.06)}
@media (min-width:700px){.tile{min-height:200px}}
.home-foot{padding-top:16px;display:flex;justify-content:center}

/* login, usuário e equipe (versão Cloudflare) */
.auth{max-width:440px;margin:0 auto;padding-top:4vh}
.auth .home-h .logo{width:110px}
.auth-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:6px}
.auth-box h2{font-size:26px;font-weight:700;text-transform:uppercase}
.auth-box p{margin:0 0 6px;color:var(--muted)}
.auth-form{display:grid;gap:14px}
.auth-form.narrow{max-width:420px;padding-top:20px}
.auth-form .btn{min-height:46px}
.erro{color:var(--accent);font-size:14px;min-height:1em}
.erro:empty{display:none}
.muted{color:var(--muted)}

 background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}

.sign .row{display:flex;gap:8px;align-items:center}

.sign .row .btn{min-height:auto;padding:8px 10px;font-size:13px}

.actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:24px}

/* photo viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.92);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

function autocompletar(inp,fonte,aoEscolher){
 const box=h("div",{class:"ac",role:"listbox",hidden:true});inp.parentNode.append(box);inp.setAttribute("autocomplete","off");
 let itens=[],ativo=-1;
 const marcar=()=>[...box.children].forEach((o,i)=>o.classList.toggle("on",i===ativo));
 const escolher=i=>{const it=itens[i];if(!it)return;inp.value=it.v;aoEscolher(it);box.hidden=true;};
 const mostrar=()=>{
  itens=fonte(normTxt(inp.value));ativo=-1;box.innerHTML="";
  if(!itens.length||document.activeElement!==inp){box.hidden=true;return;}
  itens.forEach((it,i)=>{const o=h("div",{class:"ac-op",role:"option"},h("span",{},it.v),it.tag?h("small",{},it.tag):null);
   o.addEventListener("mousedown",e=>{e.preventDefault();escolher(i);});box.append(o);});
  box.hidden=false;
 };
 inp.addEventListener("input",mostrar);inp.addEventListener("focus",mostrar);
 inp.addEventListener("blur",()=>setTimeout(()=>{box.hidden=true;},120));
 inp.addEventListener("keydown",e=>{
  if(box.hidden||!itens.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();ativo=(ativo+(e.key==="ArrowDown"?1:-1)+itens.length)%itens.length;marcar();}
  else if(e.key==="Enter"&&ativo>=0){e.preventDefault();e.stopImmediatePropagation();escolher(ativo);}
  else if(e.key==="Escape"){box.hidden=true;}
 },true);
}
function ligarEnderecoCidade(root,c){
 const fCid=$("#f_cidade",root),fEnd=$("#f_endereco",root);
 if(fCid){
  fCid.placeholder="Digite e escolha uma cidade da Bahia";
  autocompletar(fCid,q=>{
   if(!q)return [];
   const ini=[],meio=[];
   for(const [n,nome] of CID_IDX){if(n.startsWith(q))ini.push(nome);else if(n.includes(q))meio.push(nome);}
   return ini.concat(meio).slice(0,8).map(v=>({v,tag:"BA"}));
  },it=>{c.cidade=it.v;agendarSalvar();});
  fCid.addEventListener("blur",()=>{const n=CID_MAP.get(normTxt(fCid.value));if(n&&n!==fCid.value){fCid.value=n;c.cidade=n;agendarSalvar();}});
 }
 if(fEnd){
  autocompletar(fEnd,q=>{
   if(q.length<2)return [];
   const vistos=new Set(),out=[];
   lista.forEach(x=>{if(x.id===c.id||!x.endereco)return;const k=normTxt(x.endereco);if(vistos.has(k)||!k.includes(q))return;vistos.add(k);out.push({v:x.endereco,cid:x.cidade||"",cep:x.cep||"",tag:x.cidade||""});});
   return out.slice(0,8);
  },it=>{c.endereco=it.v;if(it.cid&&fCid){fCid.value=it.cid;c.cidade=it.cid;}const fCep=$("#f_cep");if(it.cep&&fCep&&!c.cep){fCep.value=it.cep;c.cep=it.cep;}agendarSalvar();});
 }
 const fCep=$("#f_cep",root),hint=$("#cepHint",root);
 if(fCep){
  let ultimo="";
  const preencher=(end,cid,origem)=>{
   if(end&&fEnd){fEnd.value=end;c.endereco=end;}
   if(cid&&fCid){fCid.value=cid;c.cidade=cid;}
   agendarSalvar();hint.className="cep-hint ok";hint.textContent="Endereço preenchido "+origem+". Confira e altere se precisar.";
   const fN=$("#f_numero",root);fN&&fN.focus();
  };
  const buscar=async()=>{
   const d=(c.cep||"").replace(/\D/g,"");
   if(d.length!==8){hint.className="cep-hint";hint.textContent="";ultimo="";return;}
   if(d===ultimo)return;ultimo=d;
   hint.className="cep-hint";hint.textContent="Buscando CEP…";
   // 1) consulta online (funciona quando o app está hospedado fora do claude.ai)
   try{
    const ac=new AbortController();const t=setTimeout(()=>ac.abort(),5000);
    const r=await fetch("https://viacep.com.br/ws/"+d+"/json/",{signal:ac.signal});clearTimeout(t);
    if(r.ok){const j=await r.json();if(ultimo!==d)return;
     if(j&&!j.erro){const cid=j.uf==="BA"?(CID_MAP.get(normTxt(j.localidade))||j.localidade):(j.localidade?j.localidade+"/"+j.uf:"");
      preencher([j.logradouro,j.bairro].filter(Boolean).join(" - "),cid,"pelo CEP");return;}
     hint.textContent="CEP não encontrado nos Correios. Confira os números ou digite o endereço.";return;}
   }catch(e){}
   if(ultimo!==d)return;
   // 2) vistorias anteriores com o mesmo CEP
   const ach=lista.find(x=>x.id!==c.id&&(x.cep||"").replace(/\D/g,"")===d&&(x.endereco||x.cidade));
   if(ach){preencher(ach.endereco,ach.cidade,"com os dados de uma vistoria anterior");return;}
   hint.textContent="CEP ainda não usado aqui: digite endereço e cidade. Na próxima vez ele preenche sozinho.";
  };
  fCep.addEventListener("input",buscar);
 }
}

function armarExclusao(btn,rotulo,acao){

  e.stopPropagation();

  clearTimeout(t);btn.disabled=true;btn.textContent="Excluindo…";
  await acao();
  btn.disabled=false;arm=false;btn.classList.remove("armed");btn.textContent=rotulo;
 };
}

 excluindo.add(c.id);lista=lista.filter(x=>x.id!==c.id);if(view!=="edit")atualizarTela();
 try{await saveChain;await store.remove(c.id);}

function carregarImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res({i,u});i.onerror=()=>{URL.revokeObjectURL(u);rej({msg:"Formato de imagem não suportado. Use JPG ou PNG."});};i.src=u;});}
async function processarFoto(file,itemId){
 const {i,u}=await carregarImg(file);
 const max=1400, q=0.78;
 const sc=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));
 const cv=document.createElement("canvas");cv.width=Math.round(i.naturalWidth*sc);cv.height=Math.round(i.naturalHeight*sc);
 cv.getContext("2d").drawImage(i,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
 if(assets){
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",q));
  try{const up=await assets.upload(blob,{type:"image/jpeg",checklist:cur.id,item:itemId});return {id:up.id,w:cv.width,h:cv.height,t:Date.now()};}
  catch(e){throw {msg:(e&&e.message)||"Falha ao enviar a foto. Verifique a conexão e tente de novo."};}
 }
 return {data:cv.toDataURL("image/jpeg",q),w:cv.width,h:cv.height,t:Date.now()};
}

const ELEM={
 porta:{n:"Porta",larg:"0,80",alt:"2,10",abre:1},
 janela:{n:"Janela",larg:"1,20",alt:"1,20",abre:1},
 portao:{n:"Portão",larg:"3,00",alt:"2,50",abre:1},
 ar:{n:"Ar-condicionado",sig:"AC",cor:"#2F6FB3",larg:"0,80",alt:"0,30"},
 extintor:{n:"Extintor",sig:"EX",cor:"#C2391D",larg:"0,30",alt:"0,60"},

 quadro:{n:"Quadro elétrico",sig:"QE",cor:"#B7791F",larg:"0,50",alt:"0,70"},
 luz:{n:"Iluminação de emergência",sig:"LE",cor:"#2F855A",larg:"0,30",alt:"0,10"},
 alarme:{n:"Acionador de alarme",sig:"AL",cor:"#C2391D",larg:"0,15",alt:"0,15"},
 tomada:{n:"Tomada",sig:"T",cor:"#5A6472",larg:"0,10",alt:"0,10"},
 outro:{n:"Outro",sig:"?",cor:"#5A6472",larg:"",alt:""}
};
// nome do canto onde a parede começa (ex.: parede D começa no canto C-D)
function cantoIni(a,i){const n=(a.paredes||[]).length;if(i===0)return n>1&&geoAmb(a).fechado?letra(n-1)+"-A":"início da A";return letra(i-1)+"-"+letra(i);}

const numBR=v=>{const n=parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0;};
const fmtM=n=>(Math.round(n*100)/100).toFixed(2).replace(".",",");
const letra=i=>{let s="";i++;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;};
function geoAmb(a){
 let x=0,y=0,hd=a.hd0||0;const pts=[[0,0]],segs=[];
 (a.paredes||[]).forEach((p,i)=>{
  if(p.fecha){const L=Math.hypot(x,y);if(L<0.005)return;hd=Math.atan2(-y,-x)*180/Math.PI;segs.push({x1:x,y1:y,x2:0,y2:0,len:L,hd,diag:true});x=0;y=0;pts.push([0,0]);return;}
  if(i>0)hd+=(p.vira==="e"?-90:90);const L=numBR(p.len),r=hd*Math.PI/180;
  const nx=x+L*Math.cos(r),ny=y+L*Math.sin(r);segs.push({x1:x,y1:y,x2:nx,y2:ny,len:L,hd});x=nx;y=ny;pts.push([x,y]);});
 const gap=Math.hypot(x,y);const fechado=segs.length>=3&&gap<0.02;
 let area=0;if(fechado){for(let i=0;i<pts.length-1;i++)area+=pts[i][0]*pts[i+1][1]-pts[i+1][0]*pts[i][1];area=Math.abs(area)/2;}
 const perim=segs.reduce((s,g)=>s+g.len,0);
 const pc=fechado?pts.slice(0,-1):pts;const cx=pc.reduce((s,p)=>s+p[0],0)/pc.length,cy=pc.reduce((s,p)=>s+p[1],0)/pc.length;
 return {segs,pts,fechado,gap,area,perim,cx,cy,fim:[x,y],hd};

// como fechar a sala com paredes em ângulo reto: estender a última e/ou criar até 2 paredes
function planoFechar(a){
 const G=geoAmb(a);if(G.fechado||!G.segs.length)return null;
 const r=G.hd*Math.PI/180,ux=Math.round(Math.cos(r)*1e6)/1e6,uy=Math.round(Math.sin(r)*1e6)/1e6;
 const rx=-uy,ry=ux; // direção "virar à direita"
 const vx=-G.fim[0],vy=-G.fim[1];const al=vx*ux+vy*uy,pe=vx*rx+vy*ry,eps=0.005;
 const passos=[];const n=a.paredes.length;
 if(Math.abs(pe)<eps){if(al>eps)passos.push({tipo:"estender",i:n-1,mais:al});else return null;}
 else if(Math.abs(al)<eps){passos.push({tipo:"nova",vira:pe>0?"d":"e",len:Math.abs(pe)});}
 else if(al>0){passos.push({tipo:"estender",i:n-1,mais:al});passos.push({tipo:"nova",vira:pe>0?"d":"e",len:Math.abs(pe)});}
 else{const v1=pe>0?"d":"e";passos.push({tipo:"nova",vira:v1,len:Math.abs(pe)});passos.push({tipo:"nova",vira:v1,len:Math.abs(al)});}
 // texto explicando
 let k=n;const txt=passos.map(p=>p.tipo==="estender"?"aumentar a parede "+letra(p.i)+" em "+fmtM(p.mais)+" m (fica com "+fmtM(numBR(a.paredes[p.i].len)+p.mais)+" m)":"criar a parede "+letra(k++)+" com "+fmtM(p.len)+" m virando à "+(p.vira==="d"?"direita":"esquerda"));
 return {passos,texto:"Para fechar: "+txt.join(" e ")+"."};
}
function fecharAmb(a){
 const P=planoFechar(a);if(!P)return geoAmb(a).fechado;
 P.passos.forEach(p=>{if(p.tipo==="estender"){const w=a.paredes[p.i];w.len=fmtM(numBR(w.len)+p.mais);}else a.paredes.push({len:fmtM(p.len),vira:p.vira});});
 return true;
}

  const t=e.target;

  const els=[...escopo.querySelectorAll("input:not([type=file]):not([type=checkbox]):not([type=radio]):not([hidden]),textarea,select")].filter(x=>x.offsetParent!==null&&!x.disabled&&!x.readOnly);
  const i=els.indexOf(t);

  // último campo de um formulário: Enter confirma (Entrar, Salvar, Cadastrar…)
  if(t.form){if(t.form.requestSubmit)t.form.requestSubmit();else t.form.dispatchEvent(new Event("submit",{cancelable:true}));}

/* ---------- servidor próprio (Cloudflare Worker + D1) ---------- */
let usuario=null, ultimaCarga=0;
async function api(path,opt={}){
 const headers=Object.assign({},opt.body&&typeof opt.body==="string"?{"content-type":"application/json"}:{},opt.headers||{});
 let r;
 try{r=await fetch(path,Object.assign({credentials:"same-origin"},opt,{headers}));}
 catch(e){throw {status:0,message:"Sem conexão com a internet."};}
 let d=null;try{d=await r.json();}catch(e){}
 if(!r.ok){
  const err={status:r.status,message:(d&&d.erro)||"Não foi possível concluir. Tente de novo."};
  if(r.status===401&&!/\/api\/(login|senha|setup)$/.test(path))sessaoExpirada();
  throw err;
 }
 return d;
}
let pendente=null; // vistoria aberta quando a sessão caiu: volta e salva depois do login
function sessaoExpirada(){
 if(view==="login")return;
 if(view==="edit"&&cur){pendente={c:JSON.parse(JSON.stringify(cur)),aba,voltar};clearTimeout(saveT);saveT=null;}
 usuario=null;view="login";render();toast(pendente?"Sua sessão expirou. Entre novamente: a vistoria aberta não será perdida.":"Sua sessão expirou. Entre novamente.");
}
async function recarregar(forcar){
 if(!usuario)return;
 if(!forcar&&Date.now()-ultimaCarga<4000)return;
 ultimaCarga=Date.now();
 carregarResponsaveis();
 try{lista=(await api("/api/checklists")).filter(x=>!excluindo.has(x.id));listaPronta=true;atualizarTela();}
 catch(e){if(e.status!==401){listaPronta=true;atualizarTela();if(e.status===0)toast("Sem conexão: mostrando a última lista carregada.");}}
}
store={
 list(){recarregar(true);},
 async save(c){
  const r=await api("/api/checklists/"+encodeURIComponent(c.id),{method:"PUT",body:JSON.stringify(c)});
  const nc=Object.assign({},c,{updatedAt:r.updatedAt,_atualizadoPor:usuario?usuario.nome:""});
  const i=lista.findIndex(x=>x.id===c.id);if(i>=0)lista[i]=nc;else lista.unshift(nc);
 },
 async remove(id){await api("/api/checklists/"+encodeURIComponent(id),{method:"DELETE"});lista=lista.filter(x=>x.id!==id);}
};
assets={
 async upload(blob,o){
  let r;
  try{r=await fetch("/api/fotos?checklist="+encodeURIComponent(o.checklist)+"&item="+encodeURIComponent(o.item||""),{method:"POST",body:blob,headers:{"content-type":o.type||"image/jpeg"},credentials:"same-origin"});}
  catch(e){throw {message:"Sem conexão: a foto não foi enviada. Tente de novo."};}
  const d=await r.json().catch(()=>null);
  if(!r.ok){if(r.status===401)sessaoExpirada();throw {message:(d&&d.erro)||"Falha ao enviar a foto."};}
  return d;
 },
 delete(id){return fetch("/api/fotos/"+encodeURIComponent(id),{method:"DELETE",credentials:"same-origin"});}
};
downloads={
 async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data]);
  const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  return {status:"saved"};
 }
};

  if(!rs.length)rbox.append(h("p",{class:"muted",style:"padding:12px 0"},"Nenhum responsável cadastrado ainda."));
  rs.forEach(x=>{
   const nomeEl=h("strong",{},x.nome);
   const ed=campoNome(h("input",{type:"text",value:x.nome}));
   const salvar=h("button",{class:"btn primary",type:"submit"},"Salvar");
   const canc=h("button",{class:"btn",type:"button"},"Cancelar");
   const fEd=h("form",{class:"redit",hidden:true},ed,salvar,canc);
   const btEd=h("button",{class:"btn",type:"button"},"Editar");
   const del=h("button",{class:"btn danger",type:"button"},"Excluir");
   armarExclusao(del,"Excluir",async()=>{try{await api("/api/responsaveis/"+x.id,{method:"DELETE"});toast(x.nome+" excluído");carregarR();}catch(e){toast(e.message);}});
   const acts=h("div",{class:"uact"},btEd,del);
   btEd.onclick=()=>{fEd.hidden=false;acts.hidden=true;nomeEl.hidden=true;ed.focus();};
   canc.onclick=()=>{fEd.hidden=true;acts.hidden=false;nomeEl.hidden=false;};
   fEd.addEventListener("submit",async e=>{e.preventDefault();try{await api("/api/responsaveis/"+x.id,{method:"PUT",body:JSON.stringify({nome:ed.value.trim()})});toast("Nome atualizado");carregarR();}catch(er){toast(er.message);}});
   rbox.append(h("div",{class:"urow"},h("div",{class:"uinfo"},nomeEl),acts,fEd));

 }
 carregarR();
 enterAvanca(app);
 async function carregar(){
  let us;try{us=await api("/api/usuarios");}catch(e){box.innerHTML="";box.append(h("p",{class:"erro"},e.message));return;}
  box.innerHTML="";
  us.forEach(u=>{
   const eu=usuario&&u.id===usuario.id;
   const row=h("div",{class:"urow"+(u.ativo?"":" off")});
   const info=h("div",{class:"uinfo"},h("strong",{},u.nome+(eu?" (você)":"")),h("span",{},"@"+u.usuario),
    u.admin?h("span",{class:"tag-adm"},"admin"):null,u.ativo?null:h("span",{class:"tag-off"},"desativado"));
   const btEd=h("button",{class:"btn",type:"button"},"Editar");
   const del=eu?null:h("button",{class:"btn danger",type:"button"},"Excluir");
   if(del)armarExclusao(del,"Excluir",async()=>{try{await api("/api/usuarios/"+u.id,{method:"DELETE"});toast("Usuário "+u.nome+" excluído");carregar();}catch(e){toast(e.message);}});
   // painel de edição
   const eNome=campoNome(h("input",{type:"text",value:u.nome}));
   const eUser=campoUsuario(h("input",{type:"text",value:u.usuario}));
   const eSenha=h("input",{type:"text",placeholder:"deixe vazio para manter"});
   const eAdm=h("input",{type:"checkbox",style:"width:auto"});eAdm.checked=!!u.admin;
   const eAtivo=h("input",{type:"checkbox",style:"width:auto"});eAtivo.checked=!!u.ativo;
   const eErro=h("div",{class:"erro",role:"alert"});
   const btSalvar=h("button",{class:"btn primary",type:"submit"},"Salvar");
   const btCanc=h("button",{class:"btn",type:"button"},"Cancelar");
   const painel=h("form",{class:"uedit",hidden:true},
    h("div",{class:"grid"},
     h("label",{class:"f"},h("span",{},"Nome"),eNome),
     h("label",{class:"f"},h("span",{},"Usuário de acesso"),eUser),
     eu?null:h("label",{class:"f"},h("span",{},"Nova senha"),eSenha)),
    eu?h("p",{class:"muted",style:"margin:8px 0 0;font-size:13px"},"Para trocar a sua senha, use Trocar senha na tela inicial."):
     h("div",{class:"uchecks"},h("label",{class:"chk"},eAdm,"Administrador"),h("label",{class:"chk"},eAtivo,"Ativo (pode entrar)")),
    eErro,h("div",{class:"uedit-bt"},btSalvar,btCanc));
   btEd.onclick=()=>{painel.hidden=!painel.hidden;btEd.hidden=!painel.hidden;if(del)del.hidden=!painel.hidden;if(!painel.hidden)eNome.focus();};
   btCanc.onclick=()=>{painel.hidden=true;btEd.hidden=false;if(del)del.hidden=false;eErro.textContent="";};
   painel.addEventListener("submit",async e=>{
    e.preventDefault();eErro.textContent="";
    const body={nome:eNome.value.trim(),usuario:eUser.value.trim()};
    if(!eu){body.admin=eAdm.checked;body.ativo=eAtivo.checked;if(eSenha.value){if(eSenha.value.length<6){eErro.textContent="A senha precisa ter pelo menos 6 caracteres.";return;}body.senha=eSenha.value;}}
    btSalvar.disabled=true;
    try{await api("/api/usuarios/"+u.id,{method:"PUT",body:JSON.stringify(body)});
     if(eu){usuario.nome=body.nome;usuario.usuario=body.usuario;}
     toast("Usuário "+body.nome+" atualizado");carregar();}
    catch(er){eErro.textContent=er.message;btSalvar.disabled=false;}
   });
   row.append(info,h("div",{class:"uact"},btEd,del),painel);
   box.append(row);
  });
 }
 carregar();
}

async function carregarResponsaveis(){try{RESPONSAVEIS=(await api("/api/responsaveis")).map(x=>x.nome);if(view==="edit"&&repintarResp)repintarResp();}catch(e){}}
function marcarAberto(){try{sessionStorage.setItem("ppci_aberto","1");}catch(e){}}
async function iniciarSessao(){
 let e;try{e=await api("/api/estado");}catch(er){
  const app=$("#app");app.innerHTML="";
  app.append(h("div",{class:"empty",style:"margin-top:15vh"},h("h2",{},"Sem conexão"),h("p",{},"Não foi possível falar com o servidor. Verifique a internet e tente de novo."),
   h("button",{class:"btn primary",onclick:iniciarSessao},"Tentar de novo")));return;}
 if(e.precisaSetup){view="setup";render();return;}
 if(!e.usuario){view="login";render();return;}
 // app foi fechado e aberto de novo (a marca da aba sumiu): encerra a sessão e pede login
 let aberto=false;try{aberto=sessionStorage.getItem("ppci_aberto")==="1";}catch(er){aberto=true;}
 if(!aberto){try{await api("/api/logout",{method:"POST"});}catch(er){}view="login";render();return;}
 usuario=e.usuario;userId=String(usuario.id);
 if(pendente){const pd=pendente;pendente=null;cur=pd.c;aba=pd.aba;voltar=pd.voltar;view="edit";render();salvarAgora();recarregar(true);toast("Vistoria recuperada e salva.");return;}
 view="home";listaPronta=false;render();recarregar(true);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(view==="home"||view==="list"))recarregar();});
setInterval(()=>{if(!document.hidden&&(view==="home"||view==="list"))recarregar();},30000);
iniciarSessao();

})();
